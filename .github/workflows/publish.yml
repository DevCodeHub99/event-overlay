name: Automated NPM Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish Packages via OIDC Trusted Publisher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Monorepo & Distributions
        run: node build.js

      - name: Publish @event-overlay/independence-day
        run: npm publish ./packages/independence-day --access public --provenance

      - name: Publish @event-overlay/holi
        run: npm publish ./packages/holi --access public --provenance

      - name: Publish @event-overlay/core
        run: npm publish ./packages/core --access public --provenance
