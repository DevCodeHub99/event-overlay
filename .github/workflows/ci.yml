name: CI & Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build Monorepo & Standalone Packages
        run: node build.js

      - name: Verify Package Tarballs (Dry-Run)
        run: |
          npm pack ./packages/independence-day --dry-run
          npm pack ./packages/holi --dry-run
          npm pack ./packages/core --dry-run
